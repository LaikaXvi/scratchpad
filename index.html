<script language="JavaScript">
var FKeyPad = document.Keypad;
var Accumulate = 0;
var FlagNewNum = false;
var PendingOp = "";
function NumPressed (Num) {
if (FlagNewNum) {
FKeyPad.ReadOut.value  = Num;
FlagNewNum = false;
   }
else {
if (FKeyPad.ReadOut.value == "0")
FKeyPad.ReadOut.value = Num;
else
FKeyPad.ReadOut.value += Num;
   }
}
function Operation (Op) {
var Readout = FKeyPad.ReadOut.value;
if (FlagNewNum && PendingOp != "=");
else
{
FlagNewNum = true;
if ( '+' == PendingOp )
Accumulate += parseFloat(Readout);
else if ( '-' == PendingOp )
Accumulate -= parseFloat(Readout);
else if ( '/' == PendingOp )
Accumulate /= parseFloat(Readout);
else if ( '*' == PendingOp )
Accumulate *= parseFloat(Readout);
else
Accumulate = parseFloat(Readout);
FKeyPad.ReadOut.value = Accumulate;
PendingOp = Op;
   }
}
function Decimal () {
var curReadOut = FKeyPad.ReadOut.value;
if (FlagNewNum) {
curReadOut = "0.";
FlagNewNum = false;
   }
else
{
if (curReadOut.indexOf(".") == -1)
curReadOut += ".";
   }
FKeyPad.ReadOut.value = curReadOut;
}
function ClearEntry () {
FKeyPad.ReadOut.value = "0";
FlagNewNum = true;
}
function Clear () {
Accumulate = 0;
PendingOp = "";
ClearEntry();
}
function Neg () {
FKeyPad.ReadOut.value = parseFloat(FKeyPad.ReadOut.value) * -1;
}
function Percent () {
FKeyPad.ReadOut.value = (parseFloat(FKeyPad.ReadOut.value) / 100) * parseFloat(Accumulate);
}
</script>

<script type="text/javascript">
(function(){
  "use strict";
  var KEY='gg_scratchpad_clicker_v1';
  var BUILDINGS=[
    {id:'cursor', name:'Cursor',   base:15,     cps:0.1,  desc:'Auto-clicks softly.'},
    {id:'grandma',name:'Grandma',  base:100,    cps:1,    desc:'Bakes with love.'},
    {id:'farm',   name:'Farm',     base:1100,   cps:8,    desc:'Grows cookie wheat.'},
    {id:'mine',   name:'Mine',     base:12000,  cps:47,   desc:'Digs chocolate veins.'},
    {id:'factory',name:'Factory',  base:130000, cps:260,  desc:'Mass-produces treats.'},
    {id:'bank',   name:'Bank',     base:1400000,cps:1400, desc:'Compounds interest in cookies.'},
    {id:'temple', name:'Temple',   base:20000000,cps:7800,desc:'Ancient cookie rituals.'}
  ];
  var UPGRADES=[
    {id:'u_click1', name:'Reinforced Finger', cost:100,     desc:'+1 per click.', req:function(s){return s.totalClicks>=15;}},
    {id:'u_click2', name:'Titanium Finger',   cost:1000,    desc:'Click power x2.', req:function(s){return s.totalClicks>=100;}},
    {id:'u_click3', name:'Quantum Finger',    cost:50000,   desc:'Click power x2.', req:function(s){return s.totalClicks>=500;}},
    {id:'u_cur1',   name:'Ambidextrous',      cost:1000,    desc:'Cursors x2.', req:function(s){return (s.buildings.cursor||0)>=5;}},
    {id:'u_gran1',  name:'Steel Rolling Pins',cost:5000,    desc:'Grandmas x2.', req:function(s){return (s.buildings.grandma||0)>=5;}},
    {id:'u_farm1',  name:'Fertilizer',        cost:30000,   desc:'Farms x2.', req:function(s){return (s.buildings.farm||0)>=5;}},
    {id:'u_mine1',  name:'Dynamite',          cost:250000,  desc:'Mines x2.', req:function(s){return (s.buildings.mine||0)>=3;}},
    {id:'u_all1',   name:'Golden Sugar',      cost:500000,  desc:'Everything +25%.', req:function(s){return s.totalEarned>=100000;}}
  ];
  var TIERS=[
    {n:0,name:'Drifter',at:0},{n:1,name:'Settler',at:1000},{n:2,name:'Merchant',at:50000},
    {n:3,name:'Industrialist',at:1000000},{n:4,name:'Tycoon',at:50000000},{n:5,name:'Overlord',at:1000000000}
  ];
  var ACH=[
    {id:'a_first', name:'First Crumbs', desc:'Click once.'},
    {id:'a_100c',  name:'Warm Fingers', desc:'Click 100 times.'},
    {id:'a_1000c', name:'Carpal Legend', desc:'Click 1,000 times.'},
    {id:'a_1k',    name:'Baker', desc:'Earn 1,000 total.'},
    {id:'a_100k',  name:'Pastry Chef', desc:'Earn 100,000 total.'},
    {id:'a_1m',    name:'Cookie Millionaire', desc:'Earn 1,000,000 total.'},
    {id:'a_b10',   name:'Landlord', desc:'Own 10 buildings.'},
    {id:'a_b50',   name:'Mogul', desc:'Own 50 buildings.'},
    {id:'a_cps10', name:'Automation', desc:'Reach 10/sec.'},
    {id:'a_cps100',name:'Assembly Line', desc:'Reach 100/sec.'},
    {id:'a_up1',   name:'Shopper', desc:'Buy an upgrade.'},
    {id:'a_t3',    name:'Industrial Age', desc:'Reach Tier 3 Industrialist.'}
  ];
  function def(){return {cookies:0,totalEarned:0,totalClicks:0,buildings:{},upgrades:{},ach:{},autosave:true};}
  var S=def();
  try{var raw=localStorage.getItem(KEY); if(raw){var p=JSON.parse(raw); if(p&&typeof p==='object'){S=Object.assign(def(),p);} }}catch(e){}
  function fmt(n){if(n<1000)return Math.floor(n).toString();var u=['K','M','B','T','Q'];var i=-1;var x=n;while(x>=1000&&i<u.length-1){x/=1000;i++;}return (x>=100?x.toFixed(0):x>=10?x.toFixed(1):x.toFixed(2))+u[i];}
  function cost(b){var c=(S.buildings[b.id]||0);return Math.ceil(b.base*Math.pow(1.15,c));}
  function bMult(id){var m=1;
    if(id==='cursor'&&S.upgrades.u_cur1)m*=2;
    if(id==='grandma'&&S.upgrades.u_gran1)m*=2;
    if(id==='farm'&&S.upgrades.u_farm1)m*=2;
    if(id==='mine'&&S.upgrades.u_mine1)m*=2;
    if(S.upgrades.u_all1)m*=1.25; return m;}
  function tier(){var t=TIERS[0];for(var i=0;i<TIERS.length;i++){if(S.totalEarned>=TIERS[i].at)t=TIERS[i];}return t;}
  function tierBonus(){return 1+tier().n*0.05;}
  function clickPow(){var p=1;if(S.upgrades.u_click1)p+=1;if(S.upgrades.u_click2)p*=2;if(S.upgrades.u_click3)p*=2;if(S.upgrades.u_all1)p*=1.25;return p*tierBonus();}
  function cps(){var s=0;for(var i=0;i<BUILDINGS.length;i++){var b=BUILDINGS[i];s+=(S.buildings[b.id]||0)*b.cps*bMult(b.id);}if(S.upgrades.u_all1){}return s*tierBonus();}
  var drawer=document.getElementById('gg-drawer');
  var toast=document.getElementById('gg-toast');
  var toastT=null;
  function showToast(t){toast.textContent=t;toast.style.display='block';clearTimeout(toastT);toastT=setTimeout(function(){toast.style.display='none';},2600);}
  function unlock(id){if(S.ach[id])return;S.ach[id]=true;var a=null;for(var i=0;i<ACH.length;i++)if(ACH[i].id===id)a=ACH[i];showToast('Achievement: '+(a?a.name:id));renderAch();}
  function checkAch(){var bc=0;for(var k in S.buildings)bc+=S.buildings[k];var c=cps();
    if(S.totalClicks>=1)unlock('a_first'); if(S.totalClicks>=100)unlock('a_100c'); if(S.totalClicks>=1000)unlock('a_1000c');
    if(S.totalEarned>=1000)unlock('a_1k'); if(S.totalEarned>=100000)unlock('a_100k'); if(S.totalEarned>=1000000)unlock('a_1m');
    if(bc>=10)unlock('a_b10'); if(bc>=50)unlock('a_b50'); if(c>=10)unlock('a_cps10'); if(c>=100)unlock('a_cps100');
    if(Object.keys(S.upgrades).length>=1)unlock('a_up1'); if(tier().n>=3)unlock('a_t3');}
  function gain(n){S.cookies+=n;S.totalEarned+=n;}
  function render(){
    document.getElementById('gg-count').textContent=fmt(S.cookies);
    document.getElementById('gg-cpsline').textContent='per click: '+fmt(clickPow())+'  |  per sec: '+fmt(cps());
    var t=tier();var next=null;for(var i=0;i<TIERS.length;i++)if(TIERS[i].n===t.n+1)next=TIERS[i];
    document.getElementById('gg-tiersub').textContent='Tier '+t.n+' — '+t.name;
    document.getElementById('gg-tiername').textContent=next?('Next: '+next.name+' at '+fmt(next.at)+' total ('+Math.min(100,S.totalEarned/next.at*100).toFixed(1)+'%)'):'Max tier reached. Bonus +'+Math.round((tierBonus()-1)*100)+'%';
    document.getElementById('gg-tierfill').style.width=next?(Math.min(100,S.totalEarned/next.at*100)+'%'):'100%';
    var ub=document.getElementById('gg-upgrades');ub.innerHTML='';
    var anyU=false;
    for(var i=0;i<UPGRADES.length;i++){var u=UPGRADES[i];if(S.upgrades[u.id])continue;var ok=false;try{ok=u.req(S);}catch(e){}if(!ok)continue;anyU=true;
      (function(u){var d=document.createElement('div');d.className='gg-card';
        d.innerHTML='<div class="gg-row"><div><h4></h4><p></p></div></div>';
        d.querySelector('h4').textContent=u.name+' — '+fmt(u.cost);
        d.querySelector('p').textContent=u.desc;
        var btn=document.createElement('button');btn.className='gg-btn';btn.textContent='Buy';btn.disabled=S.cookies<u.cost;
        btn.onclick=function(){if(S.cookies<u.cost)return;S.cookies-=u.cost;S.upgrades[u.id]=true;checkAch();save(true);render();};
        d.querySelector('.gg-row').appendChild(btn);ub.appendChild(d);})(u);}
    if(!anyU){ub.innerHTML='<p style="color:#888;">No upgrades available yet — keep clicking/expanding.</p>';}
    var bb=document.getElementById('gg-buildings');bb.innerHTML='';
    for(var j=0;j<BUILDINGS.length;j++){var b=BUILDINGS[j];var c=cost(b);var own=S.buildings[b.id]||0;
      (function(b,c,own){var d=document.createElement('div');d.className='gg-card';
        d.innerHTML='<div class="gg-row"><div><h4></h4><p></p></div><div style="text-align:right;"></div></div>';
        d.querySelector('h4').textContent=b.name+' × '+own;
        d.querySelector('p').textContent=b.desc+' Each: '+b.cps+'/s (x'+bMult(b.id).toFixed(2)+')';
        var wrap=d.querySelectorAll('div')[2]||d;
        var btn=document.createElement('button');btn.className='gg-btn';btn.textContent='Buy '+fmt(c);btn.disabled=S.cookies<c;
        btn.onclick=function(){var cc=cost(b);if(S.cookies<cc)return;S.cookies-=cc;S.buildings[b.id]=(S.buildings[b.id]||0)+1;checkAch();save(true);render();};
        d.querySelector('.gg-row').lastChild.appendChild(btn);bb.appendChild(d);})(b,c,own);}
    renderAch();
  }
  function renderAch(){var l=document.getElementById('gg-ach-list');if(!l)return;l.innerHTML='';
    for(var i=0;i<ACH.length;i++){var a=ACH[i];var un=!!S.ach[a.id];var d=document.createElement('div');
      d.className='gg-card'+(un?'':' locked');d.innerHTML='<h4></h4><p></p>';
      d.querySelector('h4').textContent=(un?'\u2713 ':'\u25CB ')+a.name;d.querySelector('p').textContent=a.desc;l.appendChild(d);}}
  function save(silent){try{localStorage.setItem(KEY,JSON.stringify(S));if(!silent){var n=document.getElementById('gg-save-note');n.textContent='Saved '+new Date().toLocaleTimeString();}}catch(e){}}
  // events
  var clicker=document.getElementById('gg-clicker');
  clicker.addEventListener('click',function(ev){var p=clickPow();gain(p);S.totalClicks++;checkAch();render();
    var f=document.createElement('div');f.className='gg-float';f.textContent='+'+fmt(p);
    f.style.left=(ev.clientX-10)+'px';f.style.top=(ev.clientY-20)+'px';document.body.appendChild(f);setTimeout(function(){f.remove();},900);});
  setInterval(function(){var c=cps();if(c>0){gain(c/10);checkAch();render();}},100);
  setInterval(function(){if(S.autosave!==false)save(true);},15000);
  document.getElementById('gg-save').onclick=function(){save(false);render();};
  document.getElementById('gg-reset').onclick=function(){if(confirm('Reset cookie save?')){S=def();save(true);render();}};
  var ab=document.getElementById('gg-autosave');ab.checked=(S.autosave!==false);
  ab.onchange=function(){S.autosave=ab.checked;save(true);};
  if(S.autosave===false)ab.checked=false;
  function toggle(force){var open=drawer.classList.contains('gg-open');var want=(typeof force==='boolean')?force:!open;
    drawer.classList.toggle('gg-open',want);drawer.setAttribute('aria-hidden',want?'false':'true');}
  document.getElementById('gg-tabstrip').addEventListener('click',function(){toggle();});
  document.getElementById('gg-tabstrip').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
  document.getElementById('gg-close').addEventListener('click',function(){toggle(false);});
  document.addEventListener('keydown',function(e){if(!e||!e.key)return;if(e.key.toLowerCase()!=='g')return;
    var t=e.target;var tag=t&&t.tagName?t.tagName.toLowerCase():'';if(tag==='input'||tag==='textarea'||tag==='select'||(t&&t.isContentEditable))return;
    if(e.ctrlKey||e.metaKey||e.altKey)return;toggle();});
  var burger=document.getElementById('gg-burger');var menu=document.getElementById('gg-menu');
  burger.addEventListener('click',function(){menu.classList.toggle('gg-show');});
  function showPane(which){document.getElementById('gg-pane-settings').style.display=which==='settings'?'block':'none';
    document.getElementById('gg-pane-ach').style.display=which==='ach'?'block':'none';
    if(!menu.classList.contains('gg-show'))menu.classList.add('gg-show');}
  document.getElementById('gg-tab-settings').onclick=function(){var p=document.getElementById('gg-pane-settings');showPane(p.style.display==='block'?'game':'settings');};
  document.getElementById('gg-tab-ach').onclick=function(){var p=document.getElementById('gg-pane-ach');showPane(p.style.display==='block'?'game':'ach');};
  document.getElementById('gg-tab-game').onclick=function(){document.getElementById('gg-pane-settings').style.display='none';document.getElementById('gg-pane-ach').style.display='none';};
  /* ---- IRC chat (via WS bridge at /scratchpad/irc/) ---- */
  var IRC_KEY='gg_irc';
  var ircPrefs={nick:'Guest'+Math.floor(1000+Math.random()*9000),channel:'#scratchpad-drawer',gw:''};
  try{var _ip=JSON.parse(localStorage.getItem(IRC_KEY)||'null');if(_ip)ircPrefs=Object.assign(ircPrefs,_ip);}catch(e){}
  function ircGw(){
    var c=(document.getElementById('gg-irc-gw').value||'').trim();
    if(c)return c;
    if(/\.github\.io$/i.test(location.hostname))return 'wss://01m797aq07wd673t9fgaewrspg.vojk.siderusercontent.com/scratchpad/irc/';
    return (location.protocol==='https:'?'wss://':'ws://')+location.host+'/scratchpad/irc/';
  }
  var ircWs=null,ircNickTries=0;
  function ircEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function ircSave(){try{localStorage.setItem(IRC_KEY,JSON.stringify({nick:document.getElementById('gg-nick').value,channel:document.getElementById('gg-channel').value,gw:document.getElementById('gg-irc-gw').value}));}catch(e){}}
  function ircLog(html,cls){var log=document.getElementById('gg-irc-log');if(!log)return;var d=document.createElement('div');if(cls)d.style.color=cls;if(cls==='sys')d.style.color='#888';if(cls==='me')d.style.color='#8fd';if(cls==='act')d.style.color='#da7';d.innerHTML=html;log.appendChild(d);while(log.children.length>300)log.removeChild(log.firstChild);log.scrollTop=log.scrollHeight;}
  function ircStatus(txt,color){var el=document.getElementById('gg-irc-status');el.innerHTML='<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+color+';margin-right:4px;"></span>'+ircEsc(txt);}
  function ircRaw(line){if(ircWs&&ircWs.readyState===1)ircWs.send(JSON.stringify({type:'send',line:line}));}
  function ircHandle(line){
    var m=line.match(/^(?::(\S+) )?(\S+)(.*)$/);if(!m)return;
    var prefix=m[1]||'',cmd=m[2].toUpperCase(),rest=(m[3]||'').trim();
    var nick=prefix.split('!')[0];
    var trailing='',params=[];
    var tm=rest.match(/ :(.*)$/);
    if(tm){trailing=tm[1];params=rest.slice(0,tm.index).trim()?rest.slice(0,tm.index).trim().split(/\s+/):[];}
    else if(rest){params=rest.split(/\s+/);}
    if(cmd==='PING'){ircRaw('PONG :'+trailing);return;}
    if(cmd==='433'||cmd==='436'){ircNickTries++;
      if(ircNickTries<=3){var nn=(document.getElementById('gg-nick').value+'_').slice(0,16);document.getElementById('gg-nick').value=nn;ircSave();ircRaw('NICK '+nn);ircLog('Username in use, trying <b>'+ircEsc(nn)+'</b>...','sys');}
      else{ircLog('Username rejected. Pick another and reconnect.','sys');ircDisconnect();}
      return;}
    if(cmd==='001'){var ch=document.getElementById('gg-channel').value.trim()||'#scratchpad-drawer';ircRaw('JOIN '+ch);ircStatus('online','#4c4');ircLog('Connected. Joining <b>'+ircEsc(ch)+'</b>...','sys');return;}
    if(cmd==='PRIVMSG'){var tgt=params[0]||'';var me=document.getElementById('gg-nick').value;
      var act=trailing.match(/^\u0001ACTION (.*)\u0001$/);
      if(act){ircLog('* '+ircEsc(nick)+' '+ircEsc(act[1]),'act');}
      else if(tgt.charAt(0)==='#'){ircLog('&lt;'+ircEsc(nick)+'&gt; '+ircEsc(trailing));}
      else{ircLog('[dm from '+ircEsc(nick)+'] '+ircEsc(trailing),'me');}
      return;}
    if(cmd==='NOTICE'){ircLog('[notice] '+ircEsc(trailing||rest),'sys');return;}
    if(cmd==='JOIN'){ircLog('--&gt; '+ircEsc(nick)+' joined '+ircEsc(trailing||params[0]||''),'sys');return;}
    if(cmd==='PART'){ircLog('&lt;-- '+ircEsc(nick)+' left ('+ircEsc(trailing||'')+')','sys');return;}
    if(cmd==='QUIT'){ircLog('&lt;-- '+ircEsc(nick)+' quit ('+ircEsc(trailing||'')+')','sys');return;}
    if(cmd==='NICK'){ircLog('** '+ircEsc(nick)+' is now '+ircEsc(trailing),'sys');return;}
    if(cmd==='353'){var names=trailing.split(/\s+/).filter(Boolean);ircLog(names.length+' users: '+ircEsc(names.slice(0,40).join(', '))+(names.length>40?'...':''),'sys');return;}
    if(cmd==='332'){ircLog('Topic: '+ircEsc(trailing),'sys');return;}
    if(cmd==='372'||cmd==='375'||cmd==='376'){ircLog(ircEsc(trailing),'sys');return;}
  }
  function ircDisconnect(){
    try{if(ircWs&&ircWs.readyState===1)ircWs.send(JSON.stringify({type:'disconnect'}));}catch(e){}
    try{if(ircWs)ircWs.close();}catch(e){}
    ircWs=null;ircStatus('offline','#666');
    var t=document.getElementById('gg-irc-toggle');if(t)t.textContent='Connect';
  }
  function ircConnect(){
    if(ircWs&&ircWs.readyState===1){ircDisconnect();return;}
    var nick=(document.getElementById('gg-nick').value||'').trim()||ircPrefs.nick;
    document.getElementById('gg-nick').value=nick;ircSave();ircNickTries=0;
    var ws;try{ws=new WebSocket(ircGw());}catch(e){ircLog('Bad gateway URL.','sys');return;}
    ircWs=ws;
    document.getElementById('gg-irc-toggle').textContent='Disconnect';
    ircStatus('connecting...','#cc3');
    ws.onopen=function(){try{ws.send(JSON.stringify({type:'connect',host:'irc.libera.chat',port:6697,tls:true,nick:nick}));}catch(e){}};
    ws.onmessage=function(ev){var msg;try{msg=JSON.parse(ev.data);}catch(e){return;}
      if(msg.type==='line')ircHandle(msg.line);
      else if(msg.type==='status'){
        if(msg.status==='connected-irc'){ircStatus('online','#4c4');}
        if(msg.status==='disconnected'){ircStatus('offline','#666');ircLog('Disconnected.','sys');var t=document.getElementById('gg-irc-toggle');if(t)t.textContent='Connect';ircWs=null;}
      }
      else if(msg.type==='error'){ircLog('Error: '+ircEsc(msg.error||'unknown'),'sys');ircStatus('error','#c33');}};
    ws.onerror=function(){ircLog('Connection failed. Bridge or network unreachable.','sys');ircStatus('error','#c33');};
    ws.onclose=function(){ircWs=null;ircStatus('offline','#666');var t=document.getElementById('gg-irc-toggle');if(t)t.textContent='Connect';};
  }
  function ircSend(){
    var inp=document.getElementById('gg-irc-input');var text=inp.value;if(!text||!text.trim())return;inp.value='';
    if(!ircWs||ircWs.readyState!==1){ircLog('Not connected. Hit Connect first.','sys');return;}
    var ch=document.getElementById('gg-channel').value.trim()||'#scratchpad-drawer';
    var me=document.getElementById('gg-nick').value;
    if(text.charAt(0)==='/'){var sp=text.slice(1).split(' ');var c=(sp[0]||'').toLowerCase();
      if(c==='join'&&sp[1]){document.getElementById('gg-channel').value=sp[1];ircSave();ircRaw('JOIN '+sp[1]);ircLog('Joining '+ircEsc(sp[1])+'...','sys');return;}
      if(c==='part'){ircRaw('PART '+ch+(sp[1]?' :'+sp.slice(1).join(' '):''));return;}
      if(c==='nick'&&sp[1]){document.getElementById('gg-nick').value=sp[1].slice(0,16);ircSave();ircRaw('NICK '+sp[1]);return;}
      if(c==='me'){var ab=text.slice(4);ircRaw('PRIVMSG '+ch+' :\u0001ACTION '+ab+'\u0001');ircLog('* '+ircEsc(me)+' '+ircEsc(ab),'act');return;}
      if(c==='msg'&&sp[1]){var to=sp[1];var body=text.split(' ').slice(2).join(' ');ircRaw('PRIVMSG '+to+' :'+body);ircLog('[dm to '+ircEsc(to)+'] '+ircEsc(body),'me');return;}
      if(c==='quit'){ircDisconnect();return;}
      ircRaw(text.slice(1));return;}
    ircRaw('PRIVMSG '+ch+' :'+text);
    ircLog('&lt;'+ircEsc(me)+'&gt; '+ircEsc(text));
  }
  document.getElementById('gg-nick').value=ircPrefs.nick;
  document.getElementById('gg-channel').value=ircPrefs.channel||'#scratchpad-drawer';
  document.getElementById('gg-irc-gw').value=ircPrefs.gw||'';
  document.getElementById('gg-irc-toggle').addEventListener('click',ircConnect);
  document.getElementById('gg-irc-send').addEventListener('click',ircSend);
  document.getElementById('gg-irc-input').addEventListener('keydown',function(e){if(e.key==='Enter')ircSend();});
  document.getElementById('gg-nick-rand').addEventListener('click',function(){document.getElementById('gg-nick').value='Guest'+Math.floor(1000+Math.random()*9000);ircSave();});
  document.getElementById('gg-nick').addEventListener('change',ircSave);
  document.getElementById('gg-channel').addEventListener('change',ircSave);
  ircStatus('offline','#666');
  render();
})();
</script>
